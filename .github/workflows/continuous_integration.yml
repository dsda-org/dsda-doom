name: Continuous Integration

on: [push, pull_request]

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: ${{ matrix.config.shell }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "MSVC x64 (vcpkg)"
            os: windows-2022
            build_type: "Release"
            vcpkg: true
            triplet: x64-windows-static-release
            shell: pwsh
            package_name: "windows_x64_msvc"
            release: true
            artifact-path: build/*.zip
            extra_options: >-
              -A x64
              -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_INSTALLATION_ROOT}\scripts\buildsystems\vcpkg.cmake"
              -DVCPKG_TARGET_TRIPLET=x64-windows-static-release
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
              -DCMAKE_IGNORE_PATH="C:/Strawberry/perl/bin;C:/Strawberry/c/lib"

          - name: "macOS universal (vcpkg)"
            os: macos-latest
            build_type: "Release"
            vcpkg: true
            triplet: arm64-osx
            shell: bash
            package_name: "mac_uni_static"
            release: true
            artifact-path: build/*.zip
            extra_options: >-
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
              -DVCPKG_TARGET_TRIPLET=arm64-osx
              -DCMAKE_INSTALL_PREFIX=/usr
              -DVCPKG_LIBRARY_LINKAGE=static

          - name: "MSYS2 UCRT64"
            os: windows-2022
            build_type: "Release"
            extra_options: "-G Ninja"
            package_name: "windows_x64_mingw"
            shell: "msys2 {0}"
            msystem: ucrt64
            msys-env: mingw-w64-ucrt-x86_64
            artifact-path: build/*.zip

          - name: "Linux GCC"
            os: ubuntu-22.04
            build_type: "Release"
            extra_options: "-G Ninja -DCMAKE_INSTALL_PREFIX=/usr"
            release: true
            package_name: "linux_gcc"
            shell: bash
            artifact-path: |
              build/*.appimage
              build/*.appimage.zsync

          - name: "macOS arm64 (brew)"
            os: macos-latest
            build_type: "Release"
            extra_options: "-G Ninja"
            package_name: "mac_arm64"
            shell: bash
            artifact-path: build/*.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies (MSYS2)
        if: matrix.config.shell == 'msys2 {0}'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.config.msystem }}
          install: >-
            ${{ matrix.config.msys-env }}-gcc
            ${{ matrix.config.msys-env }}-cmake
            ${{ matrix.config.msys-env }}-ninja
            ${{ matrix.config.msys-env }}-pkgconf
            ${{ matrix.config.msys-env }}-libxmp
            ${{ matrix.config.msys-env }}-fluidsynth
            ${{ matrix.config.msys-env }}-libmad
            ${{ matrix.config.msys-env }}-libvorbis
            ${{ matrix.config.msys-env }}-portmidi
            ${{ matrix.config.msys-env }}-SDL2
            ${{ matrix.config.msys-env }}-SDL2_image
            ${{ matrix.config.msys-env }}-SDL2_mixer
            ${{ matrix.config.msys-env }}-libsndfile
            ${{ matrix.config.msys-env }}-libzip

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get upgrade
          sudo apt-get install -y \
            gcc \
            g++ \
            ninja-build \
            pkg-config \
            libxmp-dev \
            libgl-dev \
            libglu1-mesa-dev \
            libmad0-dev \
            libportmidi-dev \
            libvorbis-dev \
            libsndfile1-dev \
            libzip-dev \
            zipcmp \
            zipmerge \
            ziptool

      - name: Build and Install SDL (Linux)
        if: runner.os == 'Linux'
        uses: libsdl-org/setup-sdl@main
        id: setup-sdl
        with:
          install-linux-dependencies: true
          version: 3-latest
          version-sdl2-compat: 2-latest
          version-sdl-mixer: 2-latest
          cmake-arguments: -DSDL2MIXER_VENDORED=ON -DSDL2MIXER_SAMPLES=OFF
          version-sdl-image: 2-latest
          build-type: RelWithDebInfo
          pre-release: false
          add-to-environment: true

      # we need a newer fluidsynth that doesn't depend on glib
      # which causes issues for sdl
      - name: Fetch FluidSynth (Linux)
        if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          repository: FluidSynth/fluidsynth
          ref: v2.6.2
          submodules: recursive
          path: fluidsynth

      - name: Configure FluidSynth (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S fluidsynth -B fluidsynth-build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -Denable-systemd=OFF \
            -Denable-readline=OFF \
            -Denable-dbus=OFF \
            -Denable-pulseaudio=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/fluidsynth-install"

      - name: Build FluidSynth (Linux)
        if: runner.os == 'Linux'
        run: cmake --build fluidsynth-build

      - name: Install FluidSynth (Linux)
        if: runner.os == 'Linux'
        run: cmake --install fluidsynth-build

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew bundle

      - name: Generate vcpkg cache key
        if: ${{ matrix.config.vcpkg }}
        shell: bash
        run: echo "CACHE_KEY=vcpkg-${{ matrix.config.triplet }}-${{ hashFiles('prboom2/vcpkg.json') }}" >> $GITHUB_ENV

      - name: Restore vcpkg cache
        if: ${{ matrix.config.vcpkg }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: ${{ env.CACHE_KEY }}
          restore-keys: vcpkg-${{ matrix.config.triplet }}-

      - name: Configure
        env:
          CMAKE_PREFIX_PATH: ${{ runner.temp }}/fluidsynth-install
        run: >-
          cmake -S prboom2
          -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}
          -DSTRICT_FIND=ON
          ${{ matrix.config.extra_options }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config.build_type }}

      - name: Configure macOS x64 (universal)
        if: matrix.config.name == 'macOS universal (vcpkg)'
        run: >-
          cmake -S prboom2
          -B build-x64
          -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}
          -DSTRICT_FIND=ON
          -DCMAKE_OSX_ARCHITECTURES=x86_64
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-osx
          -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build macOS x64 (universal)
        if: matrix.config.name == 'macOS universal (vcpkg)'
        run: cmake --build build-x64 --config ${{ matrix.config.build_type }}

      - name: Lipo builds (universal)
        if: matrix.config.name == 'macOS universal (vcpkg)'
        run: |
            lipo build/dsda-doom build-x64/dsda-doom -create -output dsda-doom
            rm build/dsda-doom
            mv dsda-doom build

      # Delete the old cache on hit to emulate a cache update.
      - name: Delete old vcpkg cache
        if: ${{ matrix.config.vcpkg }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete --repo ${{ github.repository }} ${{ env.CACHE_KEY }}

      - name: Save vcpkg cache
        if: ${{ matrix.config.vcpkg }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: ${{ env.CACHE_KEY }}

      - name: Package
        if: ${{ matrix.config.package_name }}
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/fluidsynth-install/lib:${{ env.LD_LIBRARY_PATH }}
        run: |
          cd build
          cpack -DLINUXDEPLOY_ADDITIONAL_ARGS="--library=${{steps.setup-sdl.outputs.prefix}}/lib/libSDL3.so.0"

      - name: Upload Artifacts
        if: ${{ matrix.config.package_name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.package_name }}
          path: ${{ matrix.config.artifact-path }}
          if-no-files-found: error

      - name: Release
        if: ${{ contains(github.ref, 'tags') && matrix.config.release }}
        uses: ncipollo/release-action@v1
        with:
          name: ${{ github.ref_name }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          artifacts: ${{ matrix.config.artifact-path }}
